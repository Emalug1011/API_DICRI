openapi: 3.0.3

info:
  title: API DICRI - Gestión de Evidencias
  version: "1.0.0"
  description: API para gestionar expedientes, indicios y flujos de aprobación.

servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo

paths:
  /v1/expedientes:
    post:
      summary: Crear expediente
      tags:
        - Expedientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo_expediente
                - descripcion
              properties:
                codigo_expediente:
                  type: string
                descripcion:
                  type: string
      responses:
        '201':
          description: Expediente creado

  /v1/expedientes/{id}/indicios:
    post:
      summary: Agregar indicio a un expediente
      tags:
        - Indicios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - descripcion
              properties:
                descripcion: { type: string }
                color: { type: string }
                tamano: { type: string }
                peso: { type: string }
                ubicacion: { type: string }
      responses:
        '201':
          description: Indicio creado

  /v1/expedientes/{id}/estado:
    put:
      summary: Cambiar estado del expediente
      tags:
        - Expedientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_estado_nuevo
              properties:
                id_estado_nuevo:
                  type: integer
                comentario:
                  type: string
      responses:
        '200':
          description: Estado actualizado
