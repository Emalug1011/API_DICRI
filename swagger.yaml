openapi: 3.0.3

info:
  title: API DICRI - Gestión de Evidencias
  version: "1.0.0"
  description: API para gestionar expedientes, indicios y flujos de aprobación.

servers:
  - url: http://localhost:3001/api
    description: Servidor local de desarrollo

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  # ================= EXPEDIENTES =================

  /v1/expedientes:
    post:
      summary: Crear expediente
      tags:
        - Expedientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                
                - descripcion
              properties:
 
                descripcion:
                  type: string
            example:
              
              descripcion: "Robo en local comercial"
      responses:
        '201':
          description: Expediente creado
    get:
      summary: Listar expedientes
      tags:
        - Expedientes
      parameters:
        - in: query
          name: estado
          schema:
            type: integer
          required: false
          description: Id del estado del expediente
        - in: query
          name: fecha_inicio
          schema:
            type: string
            format: date
          required: false
        - in: query
          name: fecha_fin
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: Lista de expedientes
 
  /v1/expedientes/filter:
    get:
      summary: Listar expedientes con filtros
      description: >
        Permite consultar expedientes utilizando filtros opcionales como estado,
        rango de fechas (fecha_inicio, fecha_fin) o ambos.
      tags:
        - Expedientes
      parameters:
        - in: query
          name: estado
          required: false
          schema:
            type: integer
          description: >
            Estado del expediente.
        - in: query
          name: fecha_inicio
          required: false
          schema:
            type: string
            format: date
          example: "2025-01-01"
          description: Fecha inicial del rango.
        - in: query
          name: fecha_fin
          required: false
          schema:
            type: string
            format: date
          example: "2025-01-31"
          description: Fecha final del rango.
      responses:
        '200':
          description: Lista de expedientes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
                - id_expediente: 10
                  codigo: "EXP-2025-0001"
                  estado: "En Revisión"
                - id_expediente: 11
                  codigo: "EXP-2025-0002"
                  estado: "Registrado"
        '500':
          description: Error interno  

  /v1/expedientes/{id}:
    get:
      summary: Obtener expediente completo (datos, indicios, historial)
      tags:
        - Expedientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Expediente encontrado
        '404':
          description: Expediente no encontrado

  /v1/expedientes/{id}/estado:
    put:
      summary: Cambiar estado del expediente (revisión / aprobación / rechazo)
      tags:
        - Expedientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_estado_nuevo
              properties:
                id_estado_nuevo:
                  type: integer
                  description: >
                    Estado destino (ej: 2=En Revisión, 3=Aprobado, 4=Rechazado).
                comentario:
                  type: string
                  description: Obligatorio si el estado es Rechazado.
            example:
              id_estado_nuevo: 4
              comentario: "Información incompleta en los indicios."
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: Flujo no permitido o falta justificación

  /v1/expedientes/mis-expedientes:
    get:
      summary: Obtener expedientes asignados al usuario autenticado
      description: >
        Devuelve los expedientes según el rol del usuario:
        - Técnico → Estados 1 (Registrado) y 4 (Rechazado)
        - Coordinador → Estado 2 (En Revisión)
        - Administrador → Todos los expedientes
      tags:
        - Expedientes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de expedientes asignados al usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expedientes:
                    type: array
                    items:
                      type: object
                      properties:
                        id_expediente:
                          type: integer
                        codigo_expediente:
                          type: string
                        descripcion:
                          type: string
                        id_estado:
                          type: integer
                        nombre_estado:
                          type: string
                        fecha_registro:
                          type: string
                        id_usuario_tecnico:
                          type: integer
        '401':
          description: Token inválido o no enviado

  /v1/expedientes/{id}/auditoria:
    get:
      summary: Obtener la auditoría del expediente
      tags:
        - Expedientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID del expediente
      responses:
        '200':
          description: Auditoría del expediente
        '404':
          description: No encontrado

  /v1/expedientes/resumen-estados:
    get:
      tags:
        - Expedientes
      summary: Resumen de expedientes por estado
      description: |
        Devuelve la cantidad total de expedientes agrupados por estado.
        Los estados activos provienen de la tabla `TC_EstadoExpediente`  
        y se cuentan los expedientes asociados desde `TT_Expediente`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Resumen de expedientes por estado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Resumen de expedientes por estado
                  resumen:
                    type: array
                    items:
                      type: object
                      properties:
                        id_estado:
                          type: integer
                          example: 1
                        nombre_estado:
                          type: string
                          example: Creado
                        total_expedientes:
                          type: integer
                          example: 10
        '401':
          description: Token inválido o no enviado.
        '500':
          description: Error interno del servidor.
  # ================= INDICIOS =================

  /v1/expedientes/{id}/indicios:
    get:
      summary: Obtener indicios activos de un expediente
      tags: [Indicios]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de indicios

    post:
      summary: Crear indicio para un expediente
      tags: [Indicios]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descripcion]
              properties:
                descripcion:
                  type: string
                color:
                  type: string
                tamano:
                  type: string
                peso:
                  type: string
                ubicacion:
                  type: string
      responses:
        '201':
          description: Indicio creado


  /v1/indicios/{id}/estado:
    put:
      summary: Actualizar estado del indicio
      tags: [Indicios]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: Estado actualizado

  # ================= AUTENTICACIÓN =================

  /v1/auth/login:
    post:
      security: []  # pública
      summary: Login de usuario
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario:
                  type: string
                contrasenia:
                  type: string
            example:
              usuario: "emalug"
              contrasenia: "MiPassword123!"
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales inválidas

  # ================= USUARIOS =================

  /v1/usuarios:
    post:
      summary: Crear un nuevo usuario
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre_completo
                - usuario
                - contrasenia
                - id_rol
              properties:
                nombre_completo:
                  type: string
                usuario:
                  type: string
                contrasenia:
                  type: string
                id_rol:
                  type: integer
            example:
              nombre_completo: "Juan Pérez"
              usuario: "juanp"
              contrasenia: "MiPassword123!"
              id_rol: 1
      responses:
        '201':
          description: Usuario creado

    get:
      summary: Obtener todos los usuarios
      tags:
        - Usuarios
      responses:
        '200':
          description: Lista de usuarios

  /v1/usuarios/{id}:
    get:
      summary: Obtener un usuario por ID
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado

    put:
      summary: Actualizar un usuario
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_completo:
                  type: string
                usuario:
                  type: string
                id_rol:
                  type: integer
            example:
              nombre_completo: "Juan Pérez Actualizado"
              usuario: "juanp"
              id_rol: 2
      responses:
        '200':
          description: Usuario actualizado

  /v1/usuarios/{id}/password:
    put:
      summary: Cambiar contraseña del usuario
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nueva_contrasenia
              properties:
                nueva_contrasenia:
                  type: string
            example:
              nueva_contrasenia: "NuevaPassword2025!"
      responses:
        '200':
          description: Contraseña actualizada
