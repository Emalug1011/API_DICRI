openapi: 3.0.3

info:
  title: API DICRI - Gestión de Evidencias
  version: "1.0.0"
  description: API para gestionar expedientes, indicios y flujos de aprobación.

servers:
  - url: http://localhost:3000/api
    description: Servidor local de desarrollo

# ======================================================
# 🔐 SEGURIDAD GLOBAL
# ======================================================
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /v1/expedientes:
    post:
      summary: Crear expediente
      tags:
        - Expedientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - codigo_expediente
                - descripcion
              properties:
                codigo_expediente:
                  type: string
                descripcion:
                  type: string
      responses:
        '201':
          description: Expediente creado

  /v1/expedientes/{id}/indicios:
    post:
      summary: Agregar indicio a un expediente
      tags:
        - Indicios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - descripcion
              properties:
                descripcion: { type: string }
                color: { type: string }
                tamano: { type: string }
                peso: { type: string }
                ubicacion: { type: string }
      responses:
        '201':
          description: Indicio creado

  /v1/expedientes/{id}/estado:
    put:
      summary: Cambiar estado del expediente
      tags:
        - Expedientes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_estado_nuevo
              properties:
                id_estado_nuevo:
                  type: integer
                comentario:
                  type: string
      responses:
        '200':
          description: Estado actualizado

  /v1/auth/login:
    post:
      security: []  # ESTA RUTA ES PUBLICA
      summary: Login de usuario
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                usuario:
                  type: string
                contrasenia:
                  type: string
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales inválidas

  /v1/usuarios:
    post:
      summary: Crear un nuevo usuario
      tags:
        - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre_completo
                - usuario
                - contrasenia
                - id_rol
              properties:
                nombre_completo:
                  type: string
                usuario:
                  type: string
                contrasenia:
                  type: string
                id_rol:
                  type: integer
      responses:
        '201':
          description: Usuario creado

    get:
      summary: Obtener todos los usuarios
      tags:
        - Usuarios
      responses:
        '200':
          description: Lista de usuarios

  /v1/usuarios/{id}:
    get:
      summary: Obtener un usuario por ID
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado

    put:
      summary: Actualizar un usuario
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre_completo:
                  type: string
                usuario:
                  type: string
                id_rol:
                  type: integer
      responses:
        '200':
          description: Usuario actualizado

  /v1/usuarios/{id}/password:
    put:
      summary: Cambiar contraseña del usuario
      tags:
        - Usuarios
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nueva_contrasenia
              properties:
                nueva_contrasenia:
                  type: string
      responses:
        '200':
          description: Contraseña actualizada
